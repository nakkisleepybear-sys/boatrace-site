return h+'</div>';}
function venue(){var v=D.venues[S.vc]||{},rs=byV(S.vc),hh=0,dn=0;
var h='<div class="vbar"><span class="back" data-go="top">‹ 一覧</span><b>'+e(v.vn)+'</b>'+(v.g?'<span class="rib">'+e(v.g)+(v.nj?'・'+e(v.nj):'')+'</span>':'')+'</div>';
if(v.ttl)h+='<div class="vttl">'+e(v.ttl)+'</div>';
rs.forEach(function(r){if(r.a){dn++;if(hitL(r))hh++;}});
h+='<div class="vstat">今日の'+LV()+'点 <b>'+hh+'</b> / '+dn+'レース的中</div><div class="rlist">';
rs.forEach(function(r){var f=fav(r),right;
if(r.a){right='<div class="res">'+cb(r.a,18)+'<span class="yen">'+(r.y||0).toLocaleString()+'円</span></div>'+(hitL(r)?'<span class="stamp s">的中</span>':'<span class="miss">'+(r.hr?r.hr+'点目で的中':'外れ')+'</span>');}
else right=(D.mode=='result'?'<span class="miss">これから</span>':'<span class="go">予想を見る ›</span>'+(r.ex?'':'<span class="chip">展示前</span>'));
h+='<div class="rrow'+(r.a?' done':'')+'" data-go="race" data-vc="'+r.vc+'" data-r="'+r.r+'"><div class="rno"><b>'+r.r+'</b>R<small>'+e(r.t)+'</small></div>'+
'<div class="fav">'+bt(f,22)+'<div><small>AIの1着候補</small><b>'+e(nm(r,f))+'</b> '+Math.round((r.wp[f]||0)*100)+'%</div></div><div class="rr">'+right+'</div></div>';});
return h+'</div>'+(D.free?cta():'')+foot();}
function lvbtn(){var h='<div class="lv">';LEVELS.forEach(function(p){if(p>D.max)return;h+='<span class="'+(S.lv==p?'on':'')+'" data-lv="'+p+'">'+p+'点<small>'+(D.hit[p]!=null?'的中'+D.hit[p].toFixed(0)+'%':'')+'</small></span>';});return h+'</div>';}
var LEVELS=[8,14,20,32];
function race(){var rs=byV(S.vc),r=null;rs.forEach(function(x){if(x.r==S.r)r=x;});if(!r)return venue();
var h='<div class="vbar"><span class="back" data-go="venue" data-vc="'+r.vc+'">‹ '+e(r.vn)+'</span><b>'+r.r+'R</b><span class="tm">締切 '+e(r.t)+'</span></div>';
h+='<div class="rtabs">'+rs.map(function(x){return '<span class="'+(x.r==r.r?'on':'')+'" data-go="race" data-vc="'+x.vc+'" data-r="'+x.r+'">'+x.r+'R</span>';}).join('')+'</div>';
h+='<div class="seg"><span class="'+(S.tab=='ai'?'on':'')+'" data-tab="ai">AI予想</span><span class="'+(S.tab=='ent'?'on':'')+'" data-tab="ent">出走表</span><span class="'+(S.tab=='tk'?'on':'')+'" data-tab="tk">展開</span></div>';
if(r.a){h+='<div class="resbox"><div><small>結果</small>'+cb(r.a,30)+'<div class="yen2">'+(r.y||0).toLocaleString()+'<small>円</small></div></div>'+
(r.hr&&r.hr<=LV()?'<div class="bigstamp">的中<small>'+r.hr+'位</small></div>':'<div class="nohit">'+(r.hr?r.hr+'点目で的中':'買い目の外')+'</div>')+'</div>';}
if(S.tab=='ai')h+=ai(r);else if(S.tab=='ent')h+=ent(r);else h+=tk(r);
return h+(D.free?cta():'')+foot();}
function ai(r){if(!r.c.length)return '<div class="box">このレースはまだ終わっていません。結果が出たら、予想した買い目と当たり外れをここに出します。</div>';
var lv=LV(),pm=Math.max.apply(null,r.p.slice(0,8).concat([1e-9])),h='';

var st=(r.st[String(lv)]||[]),tot=0,n=Math.min(D.max,r.c.length);
h+='<div class="box"><div class="bh"><b>柚の買い目'+(D.max>8?'（'+n+'点まで）':'（本命'+n+'点）')+'</b>'+(r.ex?'':'<span class="chip y">展示前の予想</span>')+(r.mi?'<span class="chip">見送りも選択肢</span>':'')+'</div>';
var cuts={8:'本命8点',14:'＋6点で14点',20:'＋6点で20点',32:'＋12点で32点（穴まで）'},prev=0;
LEVELS.forEach(function(p){if(p>n&&prev>=n)return;var to=Math.min(p,n);if(to<=prev)return;
var head=cuts[p]||(p+'点');
h+='<div class="cut'+(p>lv?' off':'')+'"><span>'+head+'</span>'+(D.hit[p]!=null?'<em>直近7日 的中'+D.hit[p].toFixed(1)+'%'+(D.roi[p]!=null?'・回収'+D.roi[p].toFixed(1)+'%':'')+'</em>':'')+'</div>';
for(var i=prev;i<to;i++){var c=r.c[i],w=Math.round((r.p[i]||0)/pm*100),m=(i<lv?(st[i]||0):0);tot+=m;
h+='<div class="li'+(c==r.a?' hit':'')+(i>=lv?' dim':'')+'"><span class="no'+(i>=8?' x':'')+'">'+(i+1)+'</span>'+cb(c,22)+'<span class="pbar"><i style="width:'+Math.min(w,100)+'%"></i></span>'+
'<span class="od">'+(r.o[i]||'-')+'<small>倍</small></span>'+(m?'<span class="mai">'+m+'枚</span>':'<span class="mai"></span>')+(c==r.a?'<span class="stamp t">的中</span>':'')+'</div>';}
prev=to;});
if(tot)h+='<div class="sum"><span>'+lv+'点で買うときの配分の合計</span><b>'+tot+'枚 = '+(tot*100).toLocaleString()+'円</b></div>';
h+='</div>';
if(D.free)h+='<div class="note">4点目からは会員限定です。</div>';
else h+='<div class="note">オッズは予想を作った時点のものです。配分は1枚100円・比率どおりに増減してください。</div>';
return h;}
function ent(r){var h='';r.ent.forEach(function(x){var w=+x.waku,c=(BOAT[w]||['#ccc'])[0];
h+='<div class="bc" style="border-left-color:'+(w==1?'#c9c9c9':c)+'">'+bt(w,30)+'<div class="bi"><b>'+e(x.name)+'</b><small>'+e(x['class'])+(x.age?'・'+Math.round(x.age)+'歳':'')+'</small><div class="chips">'+
'<span>勝率 '+(x.win_rate!=null?(+x.win_rate).toFixed(2):'-')+'</span><span>当地 '+(x.local_win_rate!=null?(+x.local_win_rate).toFixed(2):'-')+'</span>'+
'<span>モーター '+(x.motor_place2_rate!=null?Math.round(x.motor_place2_rate)+'%':'-')+'</span><span>展示 '+(x.exhibit_time?(+x.exhibit_time).toFixed(2):'-')+'</span>'+
'<span>チルト '+(x.tilt!=null?x.tilt:'-')+'</span><span>ST '+(x.avg_st!=null?(+x.avg_st).toFixed(2):'-')+'</span>'+(x.start_course&&+x.start_course!=w?'<span>進入 '+Math.round(x.start_course)+'</span>':'')+
'</div></div><div class="p1"><small>1着</small><b>'+Math.round((r.wp[String(w)]||0)*100)+'%</b></div></div>';});return h;}
function tk(r){var ks=Object.keys(r.tk).sort(function(a,b){return r.tk[b]-r.tk[a];});if(!ks.length)return '<div class="box">展開の見込みはまだありません。</div>';
var s='',l='';ks.forEach(function(k){var p=r.tk[k]*100;s+='<i style="width:'+p.toFixed(1)+'%;background:'+(KC[k]||'#ccc')+'"></i>';l+='<span><i style="background:'+(KC[k]||'#ccc')+'"></i>'+e(k)+' '+Math.round(p)+'%</span>';});
return '<div class="box"><div class="bh"><b>決まり手の見込み</b></div><div class="segbar">'+s+'</div><div class="segl">'+l+'</div></div>';}
function cta(){return '<div class="cta">'+(D.free?'4点目からの買い目は<b>会員限定</b>です<br>':'')+'<a href="'+D.note+'">メンバーシップを見る</a></div>';}
function foot(){return '<button class="reload" onclick="location.reload()">最新に更新（'+e(D.gen)+'時点）</button><div class="foot">20歳未満の方は舟券を購入できません。<br>予想は参考情報です。舟券の購入はご自身の判断でお願いします。</div>';}
function lvbar(){if(D.max<=8||IN_FRAME)return '';return '<div class="lvbar"><span class="lvt">何点で買う？</span>'+lvbtn()+'</div>';}
function draw(){A.innerHTML=lvbar()+(S.v=='race'?race():S.v=='venue'?venue():vTop());}
A.addEventListener('click',function(ev){var t=ev.target.closest('[data-go],[data-tab],[data-lv]');if(!t)return;
if(t.dataset.go){var st={v:t.dataset.go};if(t.dataset.vc)st.vc=t.dataset.vc;if(t.dataset.r)st.r=+t.dataset.r;if(st.v=='race'&&S.v!='race')st.tab='ai';go(st);}
else if(t.dataset.tab){S.tab=t.dataset.tab;draw();}else if(t.dataset.lv){setLv(+t.dataset.lv);draw();}});
try{history.replaceState(JSON.parse(JSON.stringify(S)),'');}catch(x){}
draw();
try{parent.postMessage({yuzuLv:LV(),yuzuMax:D.max},'*');}catch(x){}
})();
</script></body></html>
