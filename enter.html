<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>AI競艇予想 柚｜合言葉</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#dbe8f5;color:#23303f;font-family:-apple-system,'Hiragino Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:26px 22px;box-shadow:0 6px 20px rgba(35,48,63,.10)}
.hd{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px}
.mark{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe27a,#f2c230 60%,#d9a514);position:relative;flex:none}
.mark:after{content:"";position:absolute;right:-3px;top:-4px;width:12px;height:8px;background:#4c8c3a;border-radius:0 10px 0 10px;transform:rotate(-20deg)}
.logo{font-weight:900;font-size:19px;letter-spacing:.03em}
.sub{text-align:center;font-size:13px;color:#5b6470;margin:10px 0 18px;line-height:1.7}
input{width:100%;padding:15px;font-size:20px;font-weight:800;text-align:center;letter-spacing:.12em;background:#f4f7fb;border:2px solid #c5d7ea;border-radius:14px;color:#23303f;text-transform:uppercase}
input:focus{outline:none;border-color:#4c8c3a;background:#fff}
button{width:100%;margin-top:12px;padding:15px;font-size:17px;font-weight:900;border:none;border-radius:999px;background:#23303f;color:#f2c230;cursor:pointer}
button:disabled{background:#c5d7ea;color:#5b6470}
.msg{margin-top:12px;font-size:13px;text-align:center;line-height:1.7;min-height:1.2em}.err{color:#d23c2a}.ok{color:#4c8c3a;font-weight:800}
.golink{display:none;margin-top:10px;padding:14px;border-radius:999px;background:#4c8c3a;color:#fff;font-weight:900;text-align:center;text-decoration:none}
.note{margin-top:18px;padding-top:14px;border-top:1px solid #e3eaf2;color:#7a828c;font-size:11px;line-height:1.9}
.alt{display:none;margin-top:8px;text-align:center;font-size:12px}.alt a{color:#3b7dd8}
</style></head><body><div class="card">
<div class="hd"><span class="mark"></span><span class="logo">AI競艇予想 柚</span></div>
<p class="sub">noteでお伝えしている<b>本日の合言葉</b>を入力してください</p>
<input id="c" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" inputmode="text">
<button id="b">予想を見る</button>
<p class="msg" id="m"></p>
<a id="go" class="golink">予想ページを開く</a>
<p class="alt" id="alt"><a href="https://script.google.com/macros/s/AKfycbxSKMjXuIbtiD9r6x9mbXAW9vflfsn6ZZkifRDb6KPVbU-8FIScT_e9-eLVXG0dnhyG/exec">うまくいかない場合はこちらの入力ページへ</a></p>
<p class="note">※ 合言葉は毎日変わります。前日のものは使えません。<br>※ 予想は締切直前まで自動で更新されます。<br>※ うまく入れない場合は、noteの合言葉をコピーして貼り付けてください。</p>
</div><script>
(function(){var G="https://script.google.com/macros/s/AKfycbxSKMjXuIbtiD9r6x9mbXAW9vflfsn6ZZkifRDb6KPVbU-8FIScT_e9-eLVXG0dnhyG/exec",i=document.getElementById("c"),b=document.getElementById("b"),m=document.getElementById("m"),go=document.getElementById("go"),alt=document.getElementById("alt");
function fail(t,net){b.disabled=false;m.className="msg err";m.textContent=t;if(net)alt.style.display="block";}
function check(){var v=i.value.trim();if(!v){fail("合言葉を入力してください");return;}
b.disabled=true;m.className="msg";m.textContent="確認しています…";
fetch(G,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({code:v})})
.then(function(r){return r.json();}).then(function(d){
if(!d||!d.ok){fail((d&&d.message)||"確認できませんでした");return;}
m.className="msg ok";m.textContent="確認できました。開いています…";go.href=d.url;go.style.display="block";location.href=d.url;})
.catch(function(){fail("通信に失敗しました。もう一度お試しください。",true);});}
b.addEventListener("click",check);i.addEventListener("keydown",function(e){if(e.key==="Enter")check();});})();
</script></body></html>
