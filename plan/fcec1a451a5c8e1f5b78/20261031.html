try{var k=null,h=location.hash.match(/k=([A-Za-z0-9_-]+)/);
if(h){k=h[1];try{localStorage.setItem('k:'+ID,k);}catch(e){}try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}
else{try{k=localStorage.getItem('k:'+ID);}catch(e){}}
if(!k){fail('このページは合言葉で開くページです。<br><br><a href="https://isrul5.s.gy/yoso">合言葉を入力する</a>');return;}
var key=await crypto.subtle.importKey('raw',b64(k),{name:'AES-CBC'},false,['decrypt']);
var all=b64(document.getElementById('d').textContent.trim()),pt;
try{pt=await crypto.subtle.decrypt({name:'AES-CBC',iv:all.slice(0,16)},key,all.slice(16));}
catch(e){try{localStorage.removeItem('k:'+ID);}catch(_){}fail('このページは合言葉で開くページです。<br><br><a href="https://isrul5.s.gy/yoso">合言葉を入力する</a>');return;}
var html;
if(window.DecompressionStream){html=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();}
else{await new Promise(function(ok,ng){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js';s.onload=ok;s.onerror=ng;document.head.appendChild(s);});html=pako.ungzip(new Uint8Array(pt),{to:'string'});}
document.open();document.write(html);document.close();
}catch(e){fail('表示できませんでした。ページを開き直してください。');}})();</script></body></html>
